apply plugin: 'com.android.application'

android {
    namespace 'net.smwstuff.supermariowar'
    compileSdk 35
    defaultConfig {
        applicationId 'net.smwstuff.supermariowar'
        minSdk 35
        targetSdk 35
        versionCode 3
        versionName '2.0-android-preview3'
    }
    sourceSets.main {
        java.srcDir '../third_party/SDL/android-project/app/src/main/java'
        assets.srcDir layout.buildDirectory.dir('generated/assets')
        jniLibs.srcDir layout.buildDirectory.dir('generated/jniLibs')
    }
    packagingOptions { jniLibs { useLegacyPackaging = false } }
}

tasks.register('stageGameAssets', Sync) {
    from('../game/data')
    into(layout.buildDirectory.dir('generated/assets/data'))
    includeEmptyDirs = true
    exclude '.git', '.git/**', '**/.git', '**/.git/**'
}
tasks.register('buildGameNative', Exec) {
    commandLine 'bash', '../scripts/build-native.sh'
}
tasks.named('preBuild') { dependsOn 'stageGameAssets', 'buildGameNative' }
